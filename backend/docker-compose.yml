services:
  db:
    image: postgres:15
    container_name: catalogo-editais-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-editais_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-editais_pass}
      POSTGRES_DB: ${POSTGRES_DB:-catalogo_editais}
    ports:
      - "5432:5432"
    volumes:
      - editais_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-editais_user} -d ${POSTGRES_DB:-catalogo_editais}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  editais_db_data:
